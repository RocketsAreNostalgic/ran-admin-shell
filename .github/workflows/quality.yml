name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@87e0b380092e0780861a5d9f6690a07f9d3dd0ac
    with:
      php-floor: '8.0'
      php-current: '8.5'
      php-extensions: zip
      node-version: ''

  frontend:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-node.yml@fce9bebde2f8d055990499edbc55b06bf01b25b8
    with:
      node-version-file: .node-version
      pnpm-version: '11.13.1'

  quality:
    name: quality
    if: ${{ always() }}
    needs: [baseline, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require PHP and frontend quality
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BASELINE_RESULT" = success
          test "$FRONTEND_RESULT" = success
