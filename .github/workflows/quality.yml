name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@87e0b380092e0780861a5d9f6690a07f9d3dd0ac
    with:
      php-floor: '8.0'
      php-current: '8.5'
      php-extensions: zip
      node-version: ''

  quality:
    name: quality
    if: ${{ always() }}
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Require normalized PHP quality baseline
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: test "$BASELINE_RESULT" = success
